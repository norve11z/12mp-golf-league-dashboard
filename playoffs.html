<!DOCTYPE html>
<html>
<head>
<title>Minigolf Playoffs</title>
<style>
:root {
  --bg: #1a3d2e; --card: #14301f; --card-light: #21472d;
  --green: #7cb342; --green-dark: #4a7a5a; --green-light: #b5d9a0;
  --gold: #ffe082; --muted: #819085;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { overflow: hidden; background: var(--bg); color: #fff; font-family: "Segoe UI", Arial, sans-serif; }

.container { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 12px 18px 14px; overflow: hidden; }
h1 {
  flex: 0 0 auto; margin: 0 0 10px; padding: 0 150px 8px; border-bottom: 2px solid var(--green);
  color: var(--gold); font-size: 25px; line-height: 1.2; letter-spacing: 3px;
  text-align: center; text-transform: uppercase; white-space: nowrap;
}
#content { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ===== BRACKET GRID ===== */
.bracket-wrap {
  position: relative; flex: 1 1 auto; width: 100%; height: 100%;
  min-width: 0; min-height: 0; display: grid;
grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) auto;
  grid-template-rows: minmax(0,1fr); align-items: stretch; column-gap: 14px; overflow: hidden;
}
.round-col {
  position: relative; z-index: 2; display: flex; flex-direction: column;
  align-items: stretch; justify-content: space-evenly; width: 100%; height: 100%;
  min-width: 0; min-height: 0; padding: 10px 6px; gap: 14px;
}
.round-col .col-title {
  flex: 0 0 auto; text-align: center; color: var(--green-light);
  font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px;
}

.scoring-innings {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 15px 25px;
  background: #14301f; border: 2px solid var(--green);
  border-radius: 10px; margin: 15px auto 0;
  width: fit-content;
}
.innings-display {
  display: flex; align-items: baseline; gap: 10px;
  color: var(--gold); font-family: 'Courier New', monospace;
  font-weight: 800; min-width: 110px; justify-content: center;
}
.innings-half {
  font-size: 20px; letter-spacing: 2px;
  color: var(--green-light); text-transform: uppercase;
}
.innings-number { font-size: 36px; }

/* ===== SERIES CARDS ===== */
.game-card {
  position: relative; z-index: 2; width: 100%; min-width: 0; padding: 7px 9px;
  border: 1px solid var(--green-dark); border-radius: 5px;
  background: linear-gradient(155deg, var(--card-light), var(--card));
  box-shadow: 0 2px 6px rgba(0,0,0,.22); transition: border-color .15s, box-shadow .15s;
}
.game-card.playable { border-color: var(--green); cursor: pointer; }
.game-card.playable:hover { border-color: var(--gold); box-shadow: 0 0 10px rgba(124,179,66,.3); }
.game-card.final { border: 2px solid var(--gold); }
.game-card.tbd { opacity: .55; }
.game-header { margin-bottom: 4px; color: var(--gold); font-size: 9px; font-weight: 800; line-height: 1.2; letter-spacing: .8px; text-align: center; text-transform: uppercase; }
.game-row { display: grid; grid-template-columns: minmax(0,1fr) 30px; align-items: center; min-width: 0; min-height: 24px; padding: 3px 0; border-bottom: 1px solid rgba(74,122,90,.45); }
.game-row:last-child { border-bottom: none; }
.game-player { display: block; min-width: 0; overflow: hidden; color: #fff; font-size: 12px; font-weight: 750; line-height: 1.2; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
.game-player.winner { color: var(--gold); }
.game-player.loser { color: var(--muted); text-decoration: line-through; }
.game-player.tbd { color: #72917a; font-style: italic; }
.game-score { padding: 3px 2px; border-radius: 3px; background: #0d1f14; color: var(--gold); font-family: "Courier New", monospace; font-size: 13px; font-weight: 900; line-height: 1.1; text-align: center; }
.status-badge { position: absolute; top: -6px; right: 4px; z-index: 4; padding: 2px 4px; border-radius: 2px; font-size: 7px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
.status-badge.final { background: var(--gold); color: var(--card); }
.status-badge.pending { background: var(--green); color: #fff; }
.series-meta { margin-top: 4px; text-align: center; color: var(--green-light); font-size: 8px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }

/* ===== CHAMPIONSHIP ===== */
.finals-col { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-width: 0; min-height: 0; padding: 12px 8px; }
.champion-box { position: relative; flex: 0 0 auto; width: 300px; padding: 24px 9px 14px; border: 2px solid var(--gold); border-radius: 7px; background: linear-gradient(180deg,#244d30,#14301f 65%,#0d1f14); text-align: center; box-shadow: 0 0 18px rgba(255,224,130,.2); }
.champion-box.champion-clickable:hover { box-shadow: 0 0 25px rgba(255,224,130,.5); transform: scale(1.02); transition: all .2s; }
.champion-box::before { content: "CHAMPIONSHIP"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); padding: 4px 8px; border-radius: 3px; background: var(--gold); color: var(--card); font-size: 9px; font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
.champion-box .game-card { width: 100%; padding: 7px 6px; border-color: var(--gold); background: rgba(13,31,20,.65); box-shadow: none; }
.champion-box .game-header { margin-bottom: 5px; font-size: 13px; }   /* was 10px */
.champion-box .game-row { grid-template-columns: minmax(0,1fr) 40px; min-height: 38px; }  /* was 32px / 30px */
.champion-box .game-player { font-size: 15px; }   /* was 12px */
.champion-box .game-score { font-size: 19px; }    /* was 15px */
.champion-box > div:last-child { margin-top: 12px !important; font-size: 14px !important; }  /* was 11px */

/* ===== LOCK SCREEN ===== */
.lock-screen { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 22px; }
.lock-screen p { max-width: 650px; margin: 0; color: var(--green-light); font-size: 22px; line-height: 1.5; letter-spacing: 1px; text-align: center; }
.start-btn { padding: 17px 36px; border: 2px solid var(--green-light); border-radius: 8px; background: linear-gradient(135deg,var(--green),#558b2f); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); font-size: 24px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; }
.start-btn:hover { box-shadow: 0 7px 18px rgba(124,179,66,.35); }
.start-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ===== OVERLAY SHARED ===== */
.overlay { display: none; position: fixed; inset: 0; z-index: 500; flex-direction: column; padding: 18px 24px; overflow: hidden; background: var(--bg); }
.overlay.open { display: flex; }
.overlay-topbar { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--green); }
.overlay-topbar h2 { margin: 0; color: var(--gold); font-size: 26px; letter-spacing: 2px; text-transform: uppercase; }
.ov-btn { padding: 9px 16px; border: 0; border-radius: 4px; background: var(--green); color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }
.ov-btn:hover { background: #8bc34a; }
.ov-btn.danger { background: #b71c1c; }
.ov-btn.danger:hover { background: #d32f2f; }
.ov-btn.secondary { background: var(--green-dark); }
.ov-btn.big { font-size: 20px; padding: 16px 40px; letter-spacing: 2px; text-transform: uppercase; }

/* ===== SERIES DETAIL ===== */
.detail-body { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 22px; overflow-y: auto; min-height: 0; }
.detail-record { display: grid; grid-template-columns: 50px 1fr 90px; align-items: center; width: min(100%,620px); gap: 10px; }
.detail-record .row { display: contents; }
.detail-record .seed { color: var(--green-light); font-family: 'Courier New', monospace; font-size: 20px; }
.detail-record .name { color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; grid-column: 2; padding: 10px 0; border-bottom: 2px solid rgba(74,122,90,.4); }
.detail-record .wins { color: var(--gold); font-family: 'Courier New', monospace; font-size: 30px; font-weight: 900; text-align: right; }
.detail-record .name.winner, .detail-record .wins.winner { color: var(--gold); }
.detail-sub { color: var(--green-light); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
.games-log { width: min(100%,620px); display: flex; flex-direction: column; gap: 8px; }
.log-item { display: grid; grid-template-columns: 80px 1fr 60px; align-items: center; padding: 10px 16px; border: 1px solid var(--green-dark); border-radius: 6px; background: var(--card); }
.log-item .gno { color: var(--green-light); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.log-item .matchup { color: #fff; font-size: 16px; font-weight: 700; text-transform: uppercase; }
.log-item .result { color: var(--gold); font-family: 'Courier New', monospace; font-size: 18px; font-weight: 900; text-align: right; }
.log-empty { color: var(--muted); font-style: italic; text-align: center; padding: 10px; }
.detail-champion { color: var(--gold); font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

/* ===== GAME SCORING ===== */
.scoring-board { display: grid; flex: 1 1 auto; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; justify-items: center; gap: 20px; min-height: 0; }
.scoring-side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 100%; min-width: 0; }
.scoring-name { max-width: 100%; overflow: hidden; color: var(--gold); font-size: 34px; font-weight: 800; letter-spacing: 1px; text-align: center; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
.scoring-arrow { width: 110px; height: 58px; border: 2px solid rgba(255,255,255,.3); border-radius: 5px; background: transparent; color: rgba(255,255,255,.8); font-size: 22px; font-weight: 800; cursor: pointer; }
.scoring-arrow:hover { border-color: var(--green); background: rgba(124,179,66,.15); color: #fff; }
.scoring-score { width: min(100%,250px); padding: 12px 8px; border: 2px solid var(--green-dark); border-radius: 8px; background: linear-gradient(180deg,#0d1f14,#14301f,#0d1f14); color: var(--gold); font-family: "Courier New", monospace; font-size: 120px; font-weight: 800; line-height: 1; text-align: center; }
.scoring-vs { color: var(--green); font-size: 44px; font-weight: 900; }

/* ===== CONFIRM DIALOG ===== */
.confirm-backdrop { display: none; position: fixed; inset: 0; z-index: 600; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.8); }
.confirm-backdrop.open { display: flex; }
.confirm-modal { width: min(100%,440px); padding: 24px; border: 1px solid var(--green); border-radius: 8px; background: #2d5a3d; text-align: center; box-shadow: 0 0 30px rgba(124,179,66,.2); }
.confirm-modal h3 { margin: 0 0 12px; color: var(--gold); font-size: 21px; letter-spacing: 1.5px; text-transform: uppercase; }
.confirm-modal p { margin: 12px 0; color: #fff; font-size: 16px; }
.confirm-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <h1>12MP Baseballgolf Playoffs</h1>
  <div id="content">Loading...</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx6FiPS3jaIKs9lD0TIHkMskdPjFfUvH4siagSjB8kuWLBxoy8JbH1EYL1sy_8nanlA/exec';
const API_TOKEN = '12MP67';

async function apiGet(action, extra = {}) {
  const params = new URLSearchParams({ action, token: API_TOKEN, ...extra });
  const res = await fetch(`${API_URL}?${params}`);
  return res.json();
}
async function apiPost(action, payload = {}) {
  const body = JSON.stringify({ action, token: API_TOKEN, ...payload });
  const res = await fetch(API_URL, { method: 'POST', body });
  return res.json();
}

function bestOfLabel(round) {
  if (round === 'R1') return 'Best of 3';
  if (round === 'SF') return 'Best of 5';
  return 'Best of 7';
}

const PlayoffsPage = {
  state: null,

  async load() {
    try {
      const data = await apiGet('getPlayoffs');
      if (!data.ok) throw new Error(data.error);
      if (!data.locked || !data.seeds.length) this.renderLockScreen();
      else { this.state = data; this.renderBracket(data); }
    } catch (e) {
      document.getElementById('content').innerHTML = `<p style="color:#ef5350;">Error: ${e.message}</p>`;
    }
  },

  renderLockScreen() {
    document.getElementById('content').innerHTML = `
      <div class="lock-screen">
        <p>Playoffs have not started yet.<br>Click below to lock in the top 8 seeds and generate the bracket.</p>
        <button class="start-btn" onclick="PlayoffsPage.startPlayoffs()">Start Playoffs</button>
      </div>`;
  },

  async startPlayoffs() {
    const btn = document.querySelector('.start-btn');
    btn.disabled = true; btn.textContent = 'Locking...';
    try {
      const data = await apiGet('lockPlayoffs');
      if (!data.ok) throw new Error(data.error);
      await this.load();
    } catch (e) {
      alert('Error starting playoffs: ' + e.message);
      btn.disabled = false; btn.textContent = 'Start Playoffs';
    }
  },

  renderBracket(data) {
    this.state = data;
    const seedMap = {};
    data.seeds.forEach(s => { seedMap[s.name] = s.seed; });
    const get = code => data.series.find(s => s.series === code);
    const card = code => this.renderCard(get(code), seedMap);

    const f = get('F');
    const bothSet = f && !f.isTBD;
    const clickable = bothSet ? `onclick="window.location.href='championship.html'" style="cursor:pointer;"` : '';
    const hoverClass = bothSet ? ' champion-clickable' : '';

    document.getElementById('content').innerHTML = `
      <div class="bracket-wrap">
        <div class="round-col" style="grid-column:1;">
          <div class="col-title">Round 1 · Best of 3</div>
          ${card('R1A')}${card('R1C')}${card('R1D')}${card('R1B')}
        </div>
        <div class="round-col" style="grid-column:2;">
          <div class="col-title">Semifinals · Best of 5</div>
          ${card('SF1')}${card('SF2')}
        </div>
        <div class="finals-col" style="grid-column:3;">
          <div class="champion-box${hoverClass}" ${clickable}>
            ${this.renderCard(f, seedMap, true)}
            <div style="color:#ffe082; font-size:12px; font-weight:bold; letter-spacing:2px; margin-top:8px;">LEAGUE<br>CHAMPION</div>
            ${bothSet ? '<div style="color:#b5d9a0; font-size:9px; letter-spacing:1px; margin-top:4px;">▸ CLICK TO VIEW SERIES</div>' : ''}
          </div>
        </div>
      </div>`;
  },

  renderCard(s, seedMap, isFinalBox = false) {
    if (!s) return '';
    const classes = ['game-card'];
    if (!s.isTBD && !s.clinched) classes.push('playable');
    if (s.clinched) classes.push('final');
    if (s.isTBD) classes.push('tbd');

    let p1Class = '', p2Class = '';
    if (s.clinched) {
      if (s.winner === s.player1) { p1Class = 'winner'; p2Class = 'loser'; }
      else { p1Class = 'loser'; p2Class = 'winner'; }
    }
    if (s.player1 === 'TBD') p1Class = 'tbd';
    if (s.player2 === 'TBD') p2Class = 'tbd';

    const seed1 = seedMap[s.player1] ? `<span style="color:#b5d9a0;">${seedMap[s.player1]}</span> ` : '';
    const seed2 = seedMap[s.player2] ? `<span style="color:#b5d9a0;">${seedMap[s.player2]}</span> ` : '';

    const click = (!s.isTBD && !isFinalBox) ? `onclick="SeriesDetail.open('${s.series}')"` : '';
    const badge = s.clinched ? '<span class="status-badge final">Final</span>' : (!s.isTBD ? '<span class="status-badge pending">Live</span>' : '');
    const meta = s.isTBD ? '' : `<div class="series-meta">${bestOfLabel(s.round)} · First to ${s.target}</div>`;

    return `
      <div class="${classes.join(' ')}" ${click}>
        ${badge}
        <div class="game-header">Matchup ${s.matchup}</div>
        <div class="game-row"><span class="game-player ${p1Class}">${seed1}${s.player1}</span><span class="game-score">${s.isTBD ? '-' : s.wins1}</span></div>
        <div class="game-row"><span class="game-player ${p2Class}">${seed2}${s.player2}</span><span class="game-score">${s.isTBD ? '-' : s.wins2}</span></div>
        ${meta}
      </div>`;
  }
};

// ===== SERIES DETAIL OVERLAY =====
window.SeriesDetail = {
  current: null,

  open(code) {
    const s = PlayoffsPage.state.series.find(x => x.series === code);
    if (!s || s.isTBD) return;
    this.current = s;
    this.render();
    document.getElementById('detailOverlay').classList.add('open');
  },

  render() {
    const s = this.current;
    const seedMap = {};
    PlayoffsPage.state.seeds.forEach(x => { seedMap[x.name] = x.seed; });

    document.getElementById('detailTitle').textContent = `Matchup ${s.matchup} · ${bestOfLabel(s.round)}`;

    const w1 = s.winner === s.player1 ? 'winner' : '';
    const w2 = s.winner === s.player2 ? 'winner' : '';
    const hsNote = s.headStart ? `Higher seed starts ${s.headStart}-0 · First to ${s.target}` : `First to ${s.target}`;

    let logHtml = '';
    if (s.playedGames.length) {
      s.playedGames.forEach(g => {
        logHtml += `<div class="log-item">
          <span class="gno">Game ${g.gameNo}</span>
          <span class="matchup">${g.player1} vs ${g.player2}</span>
          <span class="result">${g.score1}–${g.score2}</span>
        </div>`;
      });
    } else {
      logHtml = `<div class="log-empty">No games played yet.</div>`;
    }

    const startBtn = (!s.clinched && s.nextGameNo)
      ? `<button class="ov-btn big" onclick="GameScoring.open('${s.series}', ${s.nextGameNo})">Start Game ${s.nextGameNo}</button>`
      : (s.clinched ? `<div class="detail-champion">🏆 ${s.winner} wins the series</div>` : '');

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-record">
        <span class="seed">#${seedMap[s.player1] || '?'}</span>
        <span class="name ${w1}">${s.player1}</span>
        <span class="wins ${w1}">${s.wins1}</span>
        <span class="seed">#${seedMap[s.player2] || '?'}</span>
        <span class="name ${w2}">${s.player2}</span>
        <span class="wins ${w2}">${s.wins2}</span>
      </div>
      <div class="detail-sub">${hsNote}</div>
      <div class="games-log">${logHtml}</div>
      ${startBtn}
    `;
  },

  close() {
    document.getElementById('detailOverlay').classList.remove('open');
    this.current = null;
  },

  refresh(playoffs) {
    PlayoffsPage.state = playoffs;
    PlayoffsPage.renderBracket(playoffs);
    const updated = playoffs.series.find(x => x.series === this.current.series);
    if (updated) { this.current = updated; this.render(); }
  }
};

// ===== GAME SCORING OVERLAY =====
window.GameScoring = {
  series: null, gameNo: null, p1: '', p2: '',
  scores: { p1: 0, p2: 0 },
  halfIndex: 0,

  changeInning(delta) {
    this.halfIndex = Math.max(0, Math.min(29, this.halfIndex + delta));
    this.updateInningDisplay();
  },

  updateInningDisplay() {
    const inningNum = Math.floor(this.halfIndex / 2) + 1;
    const isTop = (this.halfIndex % 2) === 0;
    document.getElementById('inningNumber').textContent = inningNum;
    document.getElementById('inningHalf').textContent = isTop ? 'TOP' : 'BOT';
  },

  open(seriesCode, gameNo) {
    const s = PlayoffsPage.state.series.find(x => x.series === seriesCode);
    if (!s) return;
    this.series = seriesCode;
    this.gameNo = gameNo;
    this.p1 = s.player1;
    this.p2 = s.player2;
    this.scores = { p1: 0, p2: 0 };
    this.halfIndex = 0;
    this.updateInningDisplay();
    document.getElementById('scoringName1').textContent = this.p1;
    document.getElementById('scoringName2').textContent = this.p2;
    document.getElementById('scoringScore1').textContent = '0';
    document.getElementById('scoringScore2').textContent = '0';
    document.getElementById('scoringTitle').textContent = `Matchup ${s.matchup} · Game ${gameNo}`;
    document.getElementById('scoringOverlay').classList.add('open');
  },

  changeScore(side, delta) {
    const key = 'p' + side;
    this.scores[key] = Math.max(0, this.scores[key] + delta);
    document.getElementById('scoringScore' + side).textContent = this.scores[key];
  },

  attemptSubmit() {
    if (this.scores.p1 === this.scores.p2) {
      alert('Playoff games cannot end in a tie. Keep playing!');
      return;
    }
    const msg = `Submit final score:<br>
      <strong style="color:#ffe082;font-size:26px;">${this.p1} ${this.scores.p1} — ${this.scores.p2} ${this.p2}</strong>`;
    this.showConfirm('Submit Score?', msg, () => this.doSubmit());
  },

  doSubmit() {
    this.closeConfirm();
    const payload = { series: this.series, gameNo: this.gameNo, score1: this.scores.p1, score2: this.scores.p2 };
    this.close();
    apiPost('submitPlayoffGame', payload)
      .then(data => {
        if (!data.ok) throw new Error(data.error);
        if (data.playoffs) {
          if (SeriesDetail.current) SeriesDetail.refresh(data.playoffs);
          else { PlayoffsPage.state = data.playoffs; PlayoffsPage.renderBracket(data.playoffs); }
        } else {
          PlayoffsPage.load();
        }
      })
      .catch(e => alert('Error submitting: ' + e.message + '\nPlease refresh the page.'));
  },

  cancel() {
    this.showConfirm('Cancel Game?', 'This game score will not be saved. Are you sure?',
      () => { this.closeConfirm(); this.close(); });
  },

  close() {
    document.getElementById('scoringOverlay').classList.remove('open');
  },

  showConfirm(title, msg, onYes) {
    document.getElementById('gameConfirmTitle').textContent = title;
    document.getElementById('gameConfirmMsg').innerHTML = msg;
    const btn = document.getElementById('gameConfirmYes');
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', onYes);
    document.getElementById('gameConfirm').classList.add('open');
  },

  closeConfirm() {
    document.getElementById('gameConfirm').classList.remove('open');
  }
};

PlayoffsPage.load();
</script>

<!-- ===== SERIES DETAIL OVERLAY ===== -->
<div class="overlay" id="detailOverlay">
  <div class="overlay-topbar">
    <button class="ov-btn secondary" onclick="SeriesDetail.close()">← Back</button>
    <h2 id="detailTitle">Series</h2>
    <span style="width:70px;"></span>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- ===== GAME SCORING OVERLAY ===== -->
<div class="overlay" id="scoringOverlay">
  <div class="overlay-topbar">
    <button class="ov-btn danger" onclick="GameScoring.cancel()">Cancel Game</button>
    <h2 id="scoringTitle">Game</h2>
    <button class="ov-btn" onclick="GameScoring.attemptSubmit()">Submit Score</button>
  </div>
  <div class="scoring-board">
    <div class="scoring-side">
      <div class="scoring-name" id="scoringName1"></div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(1, 1)">+</button>
      <div class="scoring-score" id="scoringScore1">0</div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(1, -1)">-</button>
    </div>
    <div class="scoring-vs">VS</div>
    <div class="scoring-side">
      <div class="scoring-name" id="scoringName2"></div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(2, 1)">+</button>
      <div class="scoring-score" id="scoringScore2">0</div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(2, -1)">-</button>
    </div>
  </div>
  <div class="scoring-innings" id="scoringInnings">
    <button class="scoring-arrow" style="width:60px;height:50px;" onclick="GameScoring.changeInning(-1)">◄</button>
    <div class="innings-display">
      <span class="innings-half" id="inningHalf">TOP</span>
      <span class="innings-number" id="inningNumber">1</span>
    </div>
    <button class="scoring-arrow" style="width:60px;height:50px;" onclick="GameScoring.changeInning(1)">►</button>
  </div>
</div>

<!-- ===== CONFIRM DIALOG ===== -->
<div class="confirm-backdrop" id="gameConfirm">
  <div class="confirm-modal">
    <h3 id="gameConfirmTitle">Confirm</h3>
    <p id="gameConfirmMsg"></p>
    <div class="confirm-buttons">
      <button class="ov-btn secondary" onclick="GameScoring.closeConfirm()">Cancel</button>
      <button class="ov-btn" id="gameConfirmYes">Yes</button>
    </div>
  </div>
</div>
</body>
</html>
