<!DOCTYPE html>
<html>
<head>
<title>Championship Series</title>
<style>
:root {
  --bg: #1a3d2e; --card: #14301f; --card-light: #21472d;
  --green: #7cb342; --green-dark: #4a7a5a; --green-light: #b5d9a0;
  --gold: #ffe082; --muted: #819085;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { overflow: hidden; background: var(--bg); color: #fff; font-family: "Segoe UI", Arial, sans-serif; }
.container { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 20px 30px; overflow: hidden; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--green); }
.back-link { padding: 8px 16px; border-radius: 5px; background: var(--green-dark); color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.back-link:hover { background: #5c8b6c; }
h1 { margin: 0; color: var(--gold); font-size: 28px; letter-spacing: 4px; text-transform: uppercase; }

.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 26px; min-height: 0; overflow-y: auto; padding-top: 10px; }

.series-card {
  background: linear-gradient(180deg,#244d30,#14301f); border: 3px solid var(--gold);
  border-radius: 10px; padding: 30px 40px; box-shadow: 0 0 30px rgba(255,224,130,.25);
  position: relative; max-width: 760px; width: 100%;
}
.series-card::before {
  content: 'CHAMPIONSHIP SERIES — BEST OF 7'; position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%); background: var(--gold); color: var(--card); padding: 4px 16px;
  border-radius: 3px; font-size: 12px; font-weight: 900; letter-spacing: 3px; white-space: nowrap;
}
.player-row { display: grid; grid-template-columns: 50px 1fr 110px; align-items: center; padding: 14px 0; border-bottom: 2px solid rgba(74,122,90,.4); font-size: 28px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
.player-row:last-child { border-bottom: none; }
.player-row .seed { color: var(--green-light); font-size: 18px; font-family: 'Courier New', monospace; }
.player-row .name { color: #fff; }
.player-row .wins { color: var(--gold); font-family: 'Courier New', monospace; font-size: 24px; text-align: right; }
.player-row.winner .name, .player-row.winner .wins { color: var(--gold); }
.player-row.winner .wins::after { content: ' 👑'; font-size: 20px; }

.scoring-side-label {
  font-size: 15px; letter-spacing: 5px; font-weight: 800;
  color: var(--green-light); text-transform: uppercase;
  background: rgba(124,179,66,.15); padding: 5px 16px;
  border: 1px solid rgba(124,179,66,.35); border-radius: 4px;
}

.home-pick { display: none; position: fixed; inset: 0; z-index: 550; align-items: center; justify-content: center; background: rgba(0,0,0,.85); }
.home-pick.open { display: flex; }
.home-pick-modal { padding: 32px 40px; border: 2px solid var(--gold); border-radius: 10px; background: #2d5a3d; text-align: center; box-shadow: 0 0 30px rgba(255,224,130,.25); }
.home-pick-modal h3 { margin: 0 0 6px; color: var(--gold); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
.home-pick-modal p { margin: 0 0 22px; color: var(--green-light); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
.home-pick-btns { display: flex; gap: 16px; justify-content: center; }
.home-pick-btn { padding: 22px 30px; min-width: 190px; border: 2px solid var(--green-light); border-radius: 8px; background: linear-gradient(135deg,var(--green),#558b2f); color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
.home-pick-btn:hover { box-shadow: 0 6px 18px rgba(124,179,66,.4); }
.home-pick-btn small { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 2px; color: var(--green-light); }

.sub-note { color: var(--green-light); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
.games-log { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
.log-item { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; padding: 10px 16px; border: 1px solid var(--green-dark); border-radius: 6px; background: var(--card); }
.log-item .gno { color: var(--green-light); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.log-item .matchup { color: #fff; font-size: 16px; font-weight: 700; text-transform: uppercase; }
.log-item .result { color: var(--gold); font-family: 'Courier New', monospace; font-size: 18px; font-weight: 900; text-align: right; }
.log-empty { color: var(--muted); font-style: italic; text-align: center; padding: 10px; }

.record-btn { padding: 18px 40px; border: 2px solid var(--green-light); border-radius: 8px; background: linear-gradient(135deg,var(--green),#558b2f); color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.record-btn:hover { box-shadow: 0 7px 18px rgba(124,179,66,.35); }

.champion-banner { text-align: center; padding: 30px; background: linear-gradient(180deg,rgba(255,224,130,.15),transparent); border: 3px solid var(--gold); border-radius: 10px; max-width: 700px; width: 100%; box-shadow: 0 0 40px rgba(255,224,130,.3); }
.champion-banner .crown { font-size: 60px; margin-bottom: 10px; }
.champion-banner .label { color: var(--gold); font-size: 14px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
.champion-banner .name { color: var(--gold); font-size: 48px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,224,130,.5); margin: 10px 0; }

.scoring-side.at-bat::before {
  content: '◀'; position: absolute; left: -30px; top: 50%;
  transform: translateY(-50%); color: var(--gold); font-size: 28px;
}
.scoring-side { position: relative; }

/* ===== GAME SCORING OVERLAY ===== */
.overlay { display: none; position: fixed; inset: 0; z-index: 500; flex-direction: column; padding: 18px 24px; background: var(--bg); }
.overlay.open { display: flex; }
.overlay-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--green); }
.overlay-topbar h2 { margin: 0; color: var(--gold); font-size: 28px; letter-spacing: 2px; text-transform: uppercase; }
.ov-btn { padding: 9px 16px; border: 0; border-radius: 4px; background: var(--green); color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }
.ov-btn:hover { background: #8bc34a; }
.ov-btn.danger { background: #b71c1c; }
.ov-btn.danger:hover { background: #d32f2f; }
.ov-btn.secondary { background: var(--green-dark); }
.scoring-board { display: grid; flex: 1 1 auto; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; justify-items: center; gap: 20px; }
.scoring-side { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.scoring-name { max-width: 100%; color: var(--gold); font-size: 34px; font-weight: 800; letter-spacing: 1px; text-align: center; text-transform: uppercase; }
.scoring-arrow { width: 110px; height: 58px; border: 2px solid rgba(255,255,255,.3); border-radius: 5px; background: transparent; color: rgba(255,255,255,.8); font-size: 22px; font-weight: 800; cursor: pointer; }
.scoring-arrow:hover { border-color: var(--green); background: rgba(124,179,66,.15); color: #fff; }
.scoring-score { width: min(100%,250px); padding: 12px 8px; border: 2px solid var(--green-dark); border-radius: 8px; background: linear-gradient(180deg,#0d1f14,#14301f,#0d1f14); color: var(--gold); font-family: "Courier New", monospace; font-size: 120px; font-weight: 800; line-height: 1; text-align: center; }
.scoring-vs { color: var(--green); font-size: 44px; font-weight: 900; }


.scoring-innings {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 15px 25px;
  background: #14301f; border: 2px solid var(--green);
  border-radius: 10px; margin: 15px auto 0; width: fit-content;
}
.innings-display {
  display: flex; align-items: baseline; gap: 10px;
  color: var(--gold); font-family: 'Courier New', monospace;
  font-weight: 800; min-width: 110px; justify-content: center;
}
.innings-half {
  font-size: 20px; letter-spacing: 2px;
  color: var(--green-light); text-transform: uppercase;
}
.innings-number { font-size: 36px; }


/* ===== CONFIRM ===== */
.confirm-backdrop { display: none; position: fixed; inset: 0; z-index: 600; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.8); }
.confirm-backdrop.open { display: flex; }
.confirm-modal { width: min(100%,440px); padding: 24px; border: 1px solid var(--green); border-radius: 8px; background: #2d5a3d; text-align: center; box-shadow: 0 0 30px rgba(124,179,66,.2); }
.confirm-modal h3 { margin: 0 0 12px; color: var(--gold); font-size: 21px; letter-spacing: 1.5px; text-transform: uppercase; }
.confirm-modal p { margin: 12px 0; color: #fff; font-size: 16px; }
.confirm-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <a class="back-link" href="playoffs.html">← Back to Bracket</a>
    <h1>Championship Series</h1>
    <span style="width:120px;"></span>
  </div>
  <div class="main" id="main">Loading...</div>
</div>

<!-- Game scoring overlay -->
<div class="overlay" id="scoringOverlay">
  <div class="overlay-topbar">
    <button class="ov-btn danger" onclick="GameScoring.cancel()">Cancel Game</button>
    <h2 id="scoringTitle">Game</h2>
    <button class="ov-btn" onclick="GameScoring.attemptSubmit()">Submit Score</button>
  </div>
  <div class="scoring-board">
    <div class="scoring-side">
      <div class="scoring-side-label">HOME</div>
      <div class="scoring-name" id="scoringName1"></div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(1, 1)">+</button>
      <div class="scoring-score" id="scoringScore1">0</div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(1, -1)">-</button>
    </div>
    <div class="scoring-vs">VS</div>
    <div class="scoring-side">
      <div class="scoring-side-label">AWAY</div>
      <div class="scoring-name" id="scoringName2"></div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(2, 1)">+</button>
      <div class="scoring-score" id="scoringScore2">0</div>
      <button class="scoring-arrow" onclick="GameScoring.changeScore(2, -1)">-</button>
    </div>
  </div>
  <div class="scoring-innings" id="scoringInnings">
    <button class="scoring-arrow" style="width:60px;height:50px;" onclick="GameScoring.changeInning(-1)">◄</button>
    <div class="innings-display">
      <span class="innings-half" id="inningHalf">TOP</span>
      <span class="innings-number" id="inningNumber">1</span>
    </div>
    <button class="scoring-arrow" style="width:60px;height:50px;" onclick="GameScoring.changeInning(1)">►</button>
  </div>
</div>

<!-- Confirm -->
<div class="confirm-backdrop" id="gameConfirm">
  <div class="confirm-modal">
    <h3 id="gameConfirmTitle">Confirm</h3>
    <p id="gameConfirmMsg"></p>
    <div class="confirm-buttons">
      <button class="ov-btn secondary" onclick="GameScoring.closeConfirm()">Cancel</button>
      <button class="ov-btn" id="gameConfirmYes">Yes</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx6FiPS3jaIKs9lD0TIHkMskdPjFfUvH4siagSjB8kuWLBxoy8JbH1EYL1sy_8nanlA/exec';
const API_TOKEN = '12MP67';

async function apiGet(action, extra = {}) {
  const params = new URLSearchParams({ action, token: API_TOKEN, ...extra });
  const res = await fetch(`${API_URL}?${params}`);
  return res.json();
}
async function apiPost(action, payload = {}) {
  const body = JSON.stringify({ action, token: API_TOKEN, ...payload });
  const res = await fetch(API_URL, { method: 'POST', body });
  return res.json();
}

const ChampPage = {
  state: null,
  series: null,

  async load() {
    try {
      const data = await apiGet('getPlayoffs');
      if (!data.ok) throw new Error(data.error);
      this.state = data;
      this.series = data.series.find(s => s.series === 'F');
      if (!this.series) {
        document.getElementById('main').innerHTML =
          '<p style="color:#b5d9a0; text-align:center; font-size:20px;">Championship series not yet available.</p>';
        return;
      }
      if (this.series.isTBD) {
        document.getElementById('main').innerHTML =
          '<p style="color:#b5d9a0; text-align:center; font-size:20px;">Both finalists have not been determined yet.<br><br><a class="back-link" href="playoffs.html">Return to Bracket</a></p>';
        return;
      }
      this.render();
    } catch (e) {
      document.getElementById('main').innerHTML =
        `<p style="color:#ef5350; text-align:center;">Error: ${e.message}</p>`;
    }
  },

  render() {
    const s = this.series;
    const seedMap = {};
    this.state.seeds.forEach(x => { seedMap[x.name] = x.seed; });

    const w1 = s.winner === s.player1 ? 'winner' : '';
    const w2 = s.winner === s.player2 ? 'winner' : '';

    let logHtml = '';
    if (s.playedGames.length) {
      s.playedGames.forEach(g => {
        logHtml += `<div class="log-item">
          <span class="gno">Game ${g.gameNo}</span>
          <span class="matchup">${g.player1} vs ${g.player2}</span>
          <span class="result">${g.score1}–${g.score2}</span>
        </div>`;
      });
    } else {
      logHtml = `<div class="log-empty">No games played yet.</div>`;
    }

    const action = s.clinched
      ? `<div class="champion-banner">
           <div class="crown">🏆</div>
           <div class="label">League Champion</div>
           <div class="name">${s.winner}</div>
         </div>`
      : (s.nextGameNo
          ? `<button class="record-btn" onclick="GameScoring.open(${s.nextGameNo})">Start Game ${s.nextGameNo}</button>`
          : '');

    document.getElementById('main').innerHTML = `
      <div class="series-card">
        <div class="player-row ${w1}">
          <span class="seed">#${seedMap[s.player1] || '?'}</span>
          <span class="name">${s.player1}</span>
          <span class="wins">${s.wins1}</span>
        </div>
        <div class="player-row ${w2}">
          <span class="seed">#${seedMap[s.player2] || '?'}</span>
          <span class="name">${s.player2}</span>
          <span class="wins">${s.wins2}</span>
        </div>
      </div>
      <div class="sub-note">First to ${s.target}</div>
      <div class="games-log">${logHtml}</div>
      ${action}
    `;
  }
};

window.GameScoring = {
  gameNo: null,
  pending: null, home: '', away: '', sheetP1: '',
  scores: { p1: 0, p2: 0 },
  halfIndex: 0,

  changeInning(delta) {
    this.halfIndex = Math.max(0, Math.min(29, this.halfIndex + delta));
    this.updateInningDisplay();
  },

  updateInningDisplay() {
    const inningNum = Math.floor(this.halfIndex / 2) + 1;
    const isTop = (this.halfIndex % 2) === 0;
    document.getElementById('inningNumber').textContent = inningNum;
    document.getElementById('inningHalf').textContent = isTop ? 'TOP' : 'BOT';

    // Away team (player2 / right side) bats in the top of the inning
    const sides = document.querySelectorAll('.scoring-side');
    sides.forEach(s => s.classList.remove('at-bat'));
    if (sides.length === 2) {
      sides[isTop ? 1 : 0].classList.add('at-bat');
    }
  },
  // Step 1: ask who is home
  open(gameNo) {
    const s = ChampPage.series;
    this.pending = { gameNo, a: s.player1, b: s.player2 };
    document.getElementById('homePickTitle').textContent = `Championship · Game ${gameNo}`;
    const btnA = document.getElementById('homePickA');
    const btnB = document.getElementById('homePickB');
    btnA.innerHTML = `${s.player1}<small>home</small>`;
    btnB.innerHTML = `${s.player2}<small>home</small>`;
    btnA.onclick = () => this.startWithHome(s.player1);
    btnB.onclick = () => this.startWithHome(s.player2);
    document.getElementById('homePick').classList.add('open');
  },

  // Step 2: launch scoreboard with chosen home team on the left
  startWithHome(homeName) {
    document.getElementById('homePick').classList.remove('open');
    const p = this.pending;
    const away = homeName === p.a ? p.b : p.a;

    this.gameNo = p.gameNo;
    this.home = homeName;
    this.away = away;
    this.sheetP1 = p.a;
    this.scores = { p1: 0, p2: 0 };   // p1 = home (left), p2 = away (right)
    this.halfIndex = 0;
    this.updateInningDisplay();

    document.getElementById('scoringName1').textContent = homeName;
    document.getElementById('scoringName2').textContent = away;
    document.getElementById('scoringScore1').textContent = '0';
    document.getElementById('scoringScore2').textContent = '0';
    document.getElementById('scoringTitle').textContent = `Championship · Game ${p.gameNo}`;
    document.getElementById('scoringOverlay').classList.add('open');
  },

  changeScore(side, delta) {
    const key = 'p' + side;
    this.scores[key] = Math.max(0, this.scores[key] + delta);
    document.getElementById('scoringScore' + side).textContent = this.scores[key];
  },

  attemptSubmit() {
    if (this.scores.p1 === this.scores.p2) {
      alert('Playoff games cannot end in a tie. Keep playing!');
      return;
    }
    const msg = `Submit final score:<br>
      <strong style="color:#ffe082;font-size:26px;">${this.home} ${this.scores.p1} — ${this.scores.p2} ${this.away}</strong>`;
    this.showConfirm('Submit Score?', msg, () => this.doSubmit());
  },

  doSubmit() {
    this.closeConfirm();
    // Map home/away scores back to the sheet's player1/player2 order
    const homeIsSheetP1 = this.home === this.sheetP1;
    const payload = {
      series: 'F',
      gameNo: this.gameNo,
      score1: homeIsSheetP1 ? this.scores.p1 : this.scores.p2,
      score2: homeIsSheetP1 ? this.scores.p2 : this.scores.p1
    };
    this.close();
    apiPost('submitPlayoffGame', payload)
      .then(data => {
        if (!data.ok) throw new Error(data.error);
        if (data.playoffs) {
          ChampPage.state = data.playoffs;
          ChampPage.series = data.playoffs.series.find(s => s.series === 'F');
          ChampPage.render();
        } else {
          ChampPage.load();
        }
      })
      .catch(e => alert('Error submitting: ' + e.message + '\nPlease refresh the page.'));
  },

  cancel() {
    this.showConfirm('Cancel Game?', 'This game score will not be saved. Are you sure?',
      () => { this.closeConfirm(); this.close(); });
  },

  close() {
    document.getElementById('scoringOverlay').classList.remove('open');
  },

  showConfirm(title, msg, onYes) {
    document.getElementById('gameConfirmTitle').textContent = title;
    document.getElementById('gameConfirmMsg').innerHTML = msg;
    const btn = document.getElementById('gameConfirmYes');
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', onYes);
    document.getElementById('gameConfirm').classList.add('open');
  },

  closeConfirm() {
    document.getElementById('gameConfirm').classList.remove('open');
  }
};

ChampPage.load();
</script>
<div class="home-pick" id="homePick">
  <div class="home-pick-modal">
    <h3 id="homePickTitle">Select Home Team</h3>
    <p>Who is the Home team?</p>
    <div class="home-pick-btns">
      <button class="home-pick-btn" id="homePickA"></button>
      <button class="home-pick-btn" id="homePickB"></button>
    </div>
  </div>
</div>
</body>
</html>
